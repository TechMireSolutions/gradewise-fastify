name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - ".cursorrules"
      - ".agent/**"
      - ".claude/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - ".cursorrules"
      - ".agent/**"
      - ".claude/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Fastify + TS + Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: grade-wise-ai-backend-fastify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: grade-wise-ai-backend-fastify/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build application & distribute assets
        run: npm run build

      - name: Run Vitest test suite
        run: npm test

      - name: Audit critical supply-chain vulnerabilities
        run: npm audit --audit-level=critical

  frontend:
    name: Frontend (Next.js + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: grade-wise-ai-frontend-next
    env:
      NEXT_TELEMETRY_DISABLED: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      NEXT_PUBLIC_API_URL: "http://localhost:5005"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: grade-wise-ai-frontend-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit & utility tests
        run: npm run test:unit

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: grade-wise-ai-frontend-next/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('grade-wise-ai-frontend-next/package-lock.json') }}-${{ hashFiles('grade-wise-ai-frontend-next/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('grade-wise-ai-frontend-next/package-lock.json') }}-

      - name: Build Next.js application
        run: npm run build

      - name: ESLint
        run: npm run lint

      - name: Get Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers and OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: grade-wise-ai-frontend-next/playwright-report/
          retention-days: 14

      - name: Audit critical supply-chain vulnerabilities
        run: npm audit --audit-level=critical

  ci-gate:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Verify all workflow jobs succeeded
        run: |
          if [[ "${{ needs.backend.result }}" != "success" || "${{ needs.frontend.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All backend and frontend quality gates passed successfully."
