name: GradeWise AI Live Production Pipeline

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 11092 }}
          script: |
            set -euo pipefail
            echo "🚀 Pipeline Triggered Successfully..."

            cd /www/wwwroot/gradewiseai.techmiresolutions.com

            # Force sync to remote main (handles local drift)
            git fetch origin main
            git clean -fd -e .env -e .env.local -e .env.production -e node_modules -e .next -e .user.ini || true
            git checkout origin/main -- . 2>/dev/null || git reset --hard origin/main
            git clean -fd -e .env -e .env.local -e .env.production -e node_modules -e .next -e .user.ini || true

            # ---------------------------------------------
            # 1. BACKEND DEPLOYMENT (Fastify)
            # ---------------------------------------------
            echo "⚙️ Deploying Fastify Backend..."
            cd grade-wise-ai-backend-fastify

            [ -f .env ] || { echo "❌ ERROR: backend .env missing on server."; exit 1; }

            # Ensure SKIP_CAPTCHA is set (reCAPTCHA not configured yet)
            grep -q '^SKIP_CAPTCHA=true' .env || echo 'SKIP_CAPTCHA=true' >> .env

            npm install --ignore-engines
            npm run build
            npm run db:migrate || npx drizzle-kit push || true
            npm run db:patch
            npm run db:seed || true

            # Kill any orphaned process squatting on port 8000 (survives pm2 delete)
            fuser -k 8000/tcp 2>/dev/null || true
            sleep 1
            npx pm2 restart gradewise-api || NODE_ENV=production npx pm2 start dist/index.js --name "gradewise-api"
            cd ..

            # ---------------------------------------------
            # 2. FRONTEND DEPLOYMENT (Next.js)
            # ---------------------------------------------
            echo "📦 Deploying Next.js Frontend..."
            cd grade-wise-ai-frontend-next

            [ -f .env.production ] || [ -f .env.local ] || { echo "❌ ERROR: frontend .env.production/.env.local missing on server."; exit 1; }

            npm install --ignore-engines
            rm -rf .next
            npm run build

            # Kill orphaned next-server holding port 3000 (pm2 delete can't kill it)
            fuser -k 3000/tcp 2>/dev/null || true
            sleep 1
            npx pm2 delete gradewise-frontend 2>/dev/null || true
            npx pm2 start node_modules/next/dist/bin/next --name "gradewise-frontend" -- start -p 3000
            cd ..

            # ---------------------------------------------
            # 3. REVERSE PROXY & WEB SERVER CONFIGURATION
            # ---------------------------------------------
            echo "🌐 Configuring Web Server Reverse Proxy for gradewiseai.techmiresolutions.com..."

            # 3A. Apache configuration
            if command -v apache2ctl >/dev/null 2>&1 || [ -d /etc/apache2 ]; then
              echo "Apache detected. Enabling proxy modules..."
              a2enmod proxy proxy_http proxy_wstunnel rewrite headers 2>/dev/null || true

              cat << 'EOF' > /etc/apache2/sites-available/gradewiseai.techmiresolutions.com.conf
<VirtualHost *:80>
    ServerName gradewiseai.techmiresolutions.com
    ServerAlias www.gradewiseai.techmiresolutions.com

    ProxyPreserveHost On
    ProxyRequests Off

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:3000/$1 [P,L]

    ProxyPass /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/gradewiseai_error.log
    CustomLog ${APACHE_LOG_DIR}/gradewiseai_access.log combined
</VirtualHost>
EOF
              a2ensite gradewiseai.techmiresolutions.com.conf 2>/dev/null || true
              if apache2ctl configtest 2>/dev/null; then
                systemctl reload apache2 2>/dev/null || service apache2 reload 2>/dev/null || /etc/init.d/apache2 reload 2>/dev/null || true
                echo "✓ Apache site enabled and reloaded."
              else
                echo "⚠️ Apache configtest returned warnings."
              fi
            fi

            # 3B. aaPanel Apache vhost directory mirror
            if [ -d /www/server/panel/vhost/apache ]; then
              cp /etc/apache2/sites-available/gradewiseai.techmiresolutions.com.conf /www/server/panel/vhost/apache/gradewiseai.techmiresolutions.com.conf 2>/dev/null || true
            fi

            # 3C. Nginx configuration (if Nginx handles port 80/443)
            if command -v nginx >/dev/null 2>&1 && [ -d /etc/nginx/sites-available ]; then
              cat << 'EOF' > /etc/nginx/sites-available/gradewiseai.techmiresolutions.com.conf
server {
    listen 80;
    server_name gradewiseai.techmiresolutions.com www.gradewiseai.techmiresolutions.com;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
EOF
              ln -sf /etc/nginx/sites-available/gradewiseai.techmiresolutions.com.conf /etc/nginx/sites-enabled/ 2>/dev/null || true
              nginx -t 2>/dev/null && (systemctl reload nginx 2>/dev/null || service nginx reload 2>/dev/null || true) || true
            fi

            # 3D. Attempt automated SSL certificate creation if certbot is installed
            if command -v certbot >/dev/null 2>&1; then
              echo "Certbot detected. Ensuring SSL certificate for gradewiseai.techmiresolutions.com..."
              certbot --apache -d gradewiseai.techmiresolutions.com --non-interactive --agree-tos --register-unsafely-without-email --redirect 2>/dev/null || certbot --nginx -d gradewiseai.techmiresolutions.com --non-interactive --agree-tos --register-unsafely-without-email --redirect 2>/dev/null || true
            fi

            # ---------------------------------------------
            # 4. HEALTH CHECKS
            # ---------------------------------------------
            sleep 8
            curl -fsS http://127.0.0.1:8000/api/health || { echo "❌ Backend health check FAILED"; exit 1; }
            curl -fsS -o /dev/null http://127.0.0.1:3000 || { echo "❌ Frontend check FAILED"; exit 1; }
            curl -fsS -o /dev/null -H "Host: gradewiseai.techmiresolutions.com" http://127.0.0.1 || echo "⚠️ Domain proxy check note"

            echo "✅ Deployment complete and healthy!"
