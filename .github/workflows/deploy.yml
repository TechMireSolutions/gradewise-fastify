name: GradeWise AI Live Production Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Pipeline Triggered Successfully..."

            cd /www/wwwroot/gradewiseai.techmiresolutions.com
            git pull origin main

            # ---------------------------------------------
            # 1. BACKEND DEPLOYMENT (Fastify)
            # ---------------------------------------------
            echo "⚙️ Deploying Fastify Backend..."
            cd grade-wise-ai-backend-fastify

            # Env file guard: production loads .env.production first, then .env
            [ -f .env ] || { echo "❌ ERROR: backend .env missing on server. Create it from .env.example first."; exit 1; }

            npm ci
            npm run build
            npm run db:migrate || npx drizzle-kit push

            npx pm2 restart gradewise-api || NODE_ENV=production npx pm2 start dist/index.js --name "gradewise-api"
            cd ..

            # ---------------------------------------------
            # 2. FRONTEND DEPLOYMENT (Next.js)
            # ---------------------------------------------
            echo "📦 Deploying Next.js Frontend..."
            cd grade-wise-ai-frontend-next

            # Env file guard: NEXT_PUBLIC_API_URL etc. are baked in at build time
            [ -f .env.production ] || [ -f .env.local ] || { echo "❌ ERROR: frontend .env.production/.env.local missing on server. Create it first."; exit 1; }

            npm ci
            rm -rf .next
            npm run build

            npx pm2 restart gradewise-frontend || NODE_ENV=production npx pm2 start node_modules/next/dist/bin/next --name "gradewise-frontend" -- start -p 3000
            cd ..

            # ---------------------------------------------
            # 3. HEALTH CHECKS
            # ---------------------------------------------
            sleep 8
            curl -fsS http://127.0.0.1:8000/api/health || { echo "❌ Backend health check FAILED"; exit 1; }
            curl -fsS -o /dev/null http://127.0.0.1:3000 || { echo "❌ Frontend check FAILED"; exit 1; }

            echo "✅ Deployment complete and healthy!"
